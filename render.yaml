databases:
  - name: ecommercewebsite-db
    databaseName: ecommercewebsite
    user: ecommercewebsite_user
    plan: free

services:
  - type: web
    name: ecommercewebsite
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn ecommercewebsite.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommercewebsite-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.13

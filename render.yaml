databases:
  - name: kinmel-db
    databaseName: kinmel
    user: kinmel_user
    plan: free

services:
  - type: web
    name: kinmel
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn ecommercewebsite.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kinmel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3

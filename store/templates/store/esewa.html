<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to eSewa...</title>
</head>
<body>
<h1>Redirecting you to eSewa....</h1>
<h1>Please do not refresh your page....</h1>
<form action="{{ esewa_url }}" method="POST" name="esewaform">

</body>
<script>
document.esewaform.submit()
</script>
</html>

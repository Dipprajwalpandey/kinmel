{% extends 'store/basic.html' %}
{% block body %}
<div class="container-fluid dash-shell mt-4 mb-5">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div class="dash-sidebar">
                <div class="dash-sidebar-label">Management</div>
                <nav class="dash-nav">
                    <a href="{% url 'useradmin_overview' %}" class="dash-nav-link {% if active_tab == 'overview' %}active{% endif %}">
                        <span class="dash-nav-icon">&#9635;</span> Overview
                    </a>
                    <a href="{% url 'add_products' %}" class="dash-nav-link {% if active_tab == 'add_products' %}active{% endif %}">
                        <span class="dash-nav-icon">&#43;</span> Add Product
                    </a>
                    <a href="{% url 'reports' %}" class="dash-nav-link {% if active_tab == 'reports' %}active{% endif %}">
                        <span class="dash-nav-icon">&#128202;</span> Reports
                    </a>
                    <a href="{% url 'useradmin_orders' %}" class="dash-nav-link {% if active_tab == 'orders' %}active{% endif %}">
                        <span class="dash-nav-icon">&#128230;</span> Orders
                    </a>
                </nav>
            </div>
        </div>

        <!-- Main panel -->
        <div class="col-md-9 col-lg-10">
            {% block dash_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}

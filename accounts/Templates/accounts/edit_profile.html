{% extends 'store/basic.html' %}
{% block title %}Edit Profile - Kinmel{% endblock %}

{% block body %}
<div class="container my-5 pt-3">
    <div class="row g-5">
        <div class="col-md-4 col-lg-3">
            <div class="card border-0 shadow-sm rounded-4 mb-4">
                <div class="card-body text-center p-4">
                    <div class="avatar text-white rounded-circle mx-auto mb-3 d-flex align-items-center justify-content-center shadow-sm" style="width: 90px; height: 90px; font-size: 2.5rem; background: linear-gradient(135deg, var(--accent-blue) 0%, #1e1b4b 100%);">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                    <h4 class="card-title fw-bold mb-1">{{ user.username }}</h4>
                    <p class="text-muted small mb-0">{{ user.email }}</p>
                </div>
                <div class="list-group list-group-flush border-top p-2 gap-1">
                    <a href="{% url 'profile' %}" class="list-group-item list-group-item-action border-0 rounded-3 text-dark fw-medium"><i class="fa-solid fa-arrow-left me-2"></i>Back to Overview</a>
                </div>
            </div>
        </div>

        <div class="col-md-8 col-lg-9">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom-0 pt-4 px-4"><h4 class="fw-bold text-dark mb-0">Edit Account Information</h4></div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <h6 class="text-uppercase fw-bold text-muted small mb-3 letter-spacing-1">Personal Details</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6 form-floating">
                                <input type="text" name="first_name" id="id_first_name" class="form-control rounded-3 border-light-subtle bg-light" value="{{ u_form.first_name.value|default:'' }}" placeholder="First Name">
                                <label for="id_first_name" class="text-muted ms-2">First Name</label>
                            </div>
                            <div class="col-md-6 form-floating">
                                <input type="text" name="last_name" id="id_last_name" class="form-control rounded-3 border-light-subtle bg-light" value="{{ u_form.last_name.value|default:'' }}" placeholder="Last Name">
                                <label for="id_last_name" class="text-muted ms-2">Last Name</label>
                            </div>
                        </div>
                        
                        <div class="form-floating mb-4">
                            <input type="email" name="email" id="id_email" class="form-control rounded-3 border-light-subtle bg-light" value="{{ u_form.email.value|default:'' }}" placeholder="Email" required>
                            <label for="id_email" class="text-muted">Email Address</label>
                        </div>
                        
                        <hr class="my-4 text-muted opacity-10">
                        <h6 class="text-uppercase fw-bold text-muted small mb-3 letter-spacing-1">Contact Details</h6>
                        <div class="form-floating mb-5">
                            <input type="text" name="phone_number" id="id_phone_number" class="form-control rounded-3 border-light-subtle bg-light" value="{{ p_form.phone_number.value|default:'' }}" placeholder="Phone">
                            <label for="id_phone_number" class="text-muted">Phone Number</label>
                        </div>
                        
                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary-custom rounded-pill px-5 fw-bold shadow-sm">Save Changes</button>
                            <a href="{% url 'profile' %}" class="btn btn-outline-minimal rounded-pill px-5 fw-bold">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

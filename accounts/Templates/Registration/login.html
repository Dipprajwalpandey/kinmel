{% extends 'store/basic.html' %}
{% block title %}Login - Kinmel{% endblock %}

{% block body %}
<div class="container my-5" style="max-width: 420px;">
    <h3 class="mb-4">Login</h3>

    {% if form.errors %}
        <div class="alert alert-danger">Your username or password is incorrect.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            {{ form.username }}
        </div>
        <div class="form-group mt-3">
            <label>Password</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn btn-primary mt-4 w-100">Login</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>

    <p class="mt-3 text-center">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
